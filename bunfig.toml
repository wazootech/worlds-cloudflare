[install]
# One-day supply-chain delay, as deno.json's minimumDependencyAge enforced.
# First-party JSR packages are excluded so a just-published release resolves.
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = [
  "@jsr/wazoo__reasoner",
  "@jsr/wazoo__sparql-engine",
  "@jsr/worlds__sqlite",
  "@jsr/worlds__sdk",
]

[install.scopes]
# JSR packages resolve through JSR's npm compatibility layer (npm:@jsr/<scope>__<name>).
"@jsr" = "https://npm.jsr.io"
