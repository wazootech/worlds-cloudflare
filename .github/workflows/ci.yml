name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          cache: true
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      - name: Reject legacy platform identity names
        run: |
          if grep -R -n -E '\buid\b|world_uid|worldUid|_uid\b' src/; then
            echo "Legacy platform identity found."
            exit 1
          fi
