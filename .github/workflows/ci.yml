name: CI

on:
  # Any base branch, so each PR of a stacked series runs CI (a branches filter
  # would skip every PR that is not based on main).
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          cache: true
          deno-version: v2.9.8
      - name: Install dependencies
        run: deno ci
      - name: Run CI checks
        run: deno task ci
      - name: Reject legacy platform identity names
        run: |
          if grep -R -n -E '\buid\b|world_uid|worldUid|_uid\b' src/; then
            echo "Legacy platform identity found."
            exit 1
          fi

  # The same tests must also pass on Bun (Deno -> Bun migration,
  # wazootech/workspace#50). Bun floats on 1.x on purpose so a Bun regression
  # surfaces early. Format, lint and type check stay on Deno until the cutover.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.x"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
